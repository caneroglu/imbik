name = "gyrator"
description = "Textbook Active Inductor / Gyrator (Simulated 1H Inductor using 1 Op-Amp, Rl, C, Rg)"
feasibility_max_dc = 0.50
feasibility_rail_margin = 1.65
allow_opamps = true

# 1. High-Frequency Tracking Probe: Unity Gain (0 dB) at 1 kHz at op-amp output
[[probes]]
name = "Passband@1kHz"
probe_type = "Gain"
kind = "Closeness"
want = 1.0
soft = 0.50
weight = 4.0
require = true

[probes.condition]
freq = 1000.0
vin = 0.1
r_load = 10000.0

# 2. Virtual Ground Low-Frequency Probe: Op-amp output must attenuate (< 0.15) at 2 Hz
# (Forces high-pass RC filter at op-amp input, eliminating flat buffer cheats)
[[probes]]
name = "Stopband@2Hz"
probe_type = "Gain"
kind = "Lesser"
want = 0.50
soft = 1.01
weight = 5.0
require = false

[probes.condition]
freq = 2.0
vin = 0.1
r_load = 10000.0

# 3. Inductive Zin Low-Frequency Probe: Low input impedance (< 1000 Ohm) at 100 Hz
[[probes]]
name = "Zin@100Hz"
probe_type = "Zin"
kind = "Lesser"
want = 1000.0
soft = 50000000.0
weight = 5.0
require = false

[probes.condition]
freq = 100.0
vin = 0.1
r_load = 10000.0

# 4. Inductive Zin High-Frequency Probe: High input impedance (> 20 kOhm) at 10 kHz
[[probes]]
name = "Zin@10kHz"
probe_type = "Zin"
kind = "Greater"
want = 20000.0
soft = 5000.0
weight = 5.0
require = false

[probes.condition]
freq = 10000.0
vin = 0.1
r_load = 10000.0

# 5. DC Offset Probe: Stable DC bias (< 50mV ideal)
[[probes]]
name = "DcOffset"
probe_type = "DcOffset"
kind = "Lesser"
want = 0.05
soft = 0.50
weight = 1.5
require = false

[probes.condition]
freq = 0.0
vin = 0.0
r_load = 10000.0

# 6. BOM Count Probe: Compact textbook topology uses 4 components (1 Op-Amp + 2 R + 1 C)
[[probes]]
name = "BOM_Count"
probe_type = "Bom"
kind = "Lesser"
want = 4.0
soft = 8.0
weight = 1.0
require = false

[probes.condition]
freq = 0.0
vin = 0.0
r_load = 0.0
